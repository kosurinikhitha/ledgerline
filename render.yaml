# Render Blueprint.
# VITE_API_URL must be the API's real public URL (Render adds a random suffix when a name
# is taken, e.g. -uvk2). If you deploy this to a different account, change it to your API URL.
# CORS_ORIGIN uses a wildcard so the static site's suffix does not matter.
services:
  - type: web
    name: ledgerline-api
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm ci && npm run build
    startCommand: npm run migrate && npm run seed && npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: ledgerline-db
          property: connectionString
      - key: CORS_ORIGIN
        # `*` matches the random suffix Render may add to the static site's URL
        value: https://ledgerline*.onrender.com

  - type: web
    name: ledgerline
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        value: https://ledgerline-api-uvk2.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

databases:
  - name: ledgerline-db
    plan: free
    databaseName: ledgerline
    user: ledgerline
