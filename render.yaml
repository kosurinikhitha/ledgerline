# Render Blueprint. After the first deploy, set CORS_ORIGIN on the API to the real
# URL of the static site, and VITE_API_URL on the static site to the real API URL
# (Render may add a suffix if the names below are taken), then redeploy both.
services:
  - type: web
    name: ledgerline-api
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm ci && npm run build
    startCommand: npm run migrate && npm run seed && npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: ledgerline-db
          property: connectionString
      - key: CORS_ORIGIN
        value: https://ledgerline.onrender.com

  - type: web
    name: ledgerline
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        value: https://ledgerline-api.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

databases:
  - name: ledgerline-db
    plan: free
    databaseName: ledgerline
    user: ledgerline
